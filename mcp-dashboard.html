<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Server Registry Dashboard</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --c1: #38bdf8;
      --c2: #a78bfa;
      --c3: #34d399;
      --c4: #f472b6;
      --font: system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.6rem;
      background: linear-gradient(90deg, var(--c1), var(--c2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #status {
      color: var(--c3);
    }

    .search-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--c1);
    }

    .filter-select {
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab:hover {
      border-color: var(--c1);
      color: var(--text);
    }

    .tab.active {
      background: var(--c1);
      color: var(--bg);
      border-color: var(--c1);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      transition: 0.2s;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      border-color: var(--c1);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .card-logo {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--bg);
    }

    .card h3 {
      font-size: 0.95rem;
      color: var(--c1);
      margin: 0;
    }

    .card p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .card-author {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .tag {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 2px 8px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--c1);
      border-radius: 10px;
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .tag.local {
      background: rgba(52, 211, 153, 0.15);
      color: var(--c3);
    }

    .tag.remote {
      background: rgba(167, 139, 250, 0.15);
      color: var(--c2);
    }

    .tag.api-required {
      background: rgba(244, 114, 182, 0.15);
      color: var(--c4);
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.8rem;
      border-radius: 8px;
    }

    .stat strong {
      display: block;
      font-size: 1.5rem;
      margin-bottom: 0.2rem;
      color: var(--c1);
    }

    .stat span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 1.2rem;
      color: var(--c1);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-content {
      margin-bottom: 1.5rem;
    }

    .modal-section {
      margin-bottom: 1rem;
    }

    .modal-section h4 {
      color: var(--c2);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .modal-section p {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .config-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      color: var(--c3);
    }

    .btn {
      background: var(--c1);
      color: var(--bg);
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      border-color: var(--c1);
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    footer {
      text-align: center;
      padding: 2rem 0;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 3rem;
      font-size: 0.8rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      .search-bar {
        flex-direction: column;
      }

      .search-input {
        min-width: 100%;
      }
    }
  </style>
</head>

        <option value="name">Sort by Name</option>
        <option value="author">Sort by Author</option>
      </select>
    </div>

    <div class="tabs">

      <button class="tab" data-filter="local">Local</button>
      <button class="tab" data-filter="remote">Remote</button>
      <button class="tab" data-filter="popular">Popular</button>

    <div class="grid" id="servers-grid"></div>

    <footer>

  </div>

    let currentFilter = 'all';
    let currentSort = 'popularity';
    let selectedServer = null;

    function init() {
      updateStats();
      renderServers();
      setupEventListeners();
    }

    function updateStats() {
      const total = mcpServers.length;
      const local = mcpServers.filter(s => s.type === 'local').length;
      const remote = mcpServers.filter(s => s.type === 'remote').length;
      const categories = [...new Set(mcpServers.map(s => s.category))].length;

      document.getElementById('total-servers').textContent = total;
      document.getElementById('local-servers').textContent = local;
      document.getElementById('remote-servers').textContent = remote;
      document.getElementById('categories-count').textContent = categories;
    }

    function filterAndSortServers() {
      let filtered = [...mcpServers];
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const categoryFilter = document.getElementById('category-filter').value;

      // Search filter
      if (searchTerm) {
        filtered = filtered.filter(server => 
          server.name.toLowerCase().includes(searchTerm) ||
          server.description.toLowerCase().includes(searchTerm) ||
          server.author.toLowerCase().includes(searchTerm)
        );
      }

      // Category filter
      if (categoryFilter !== 'all') {
        if (['local', 'remote'].includes(categoryFilter)) {
          filtered = filtered.filter(server => server.type === categoryFilter);
        } else {
          filtered = filtered.filter(server => server.category === categoryFilter);
        }
      }

      // Tab filter
      if (currentFilter === 'local') {
        filtered = filtered.filter(server => server.type === 'local');
      } else if (currentFilter === 'remote') {
        filtered = filtered.filter(server => server.type === 'remote');
      } else if (currentFilter === 'popular') {
        filtered = filtered.filter(server => server.installs >= 1000);
      }

      // Sort
      if (currentSort === 'popularity') {
        filtered.sort((a, b) => b.installs - a.installs);
      } else if (currentSort === 'name') {
        filtered.sort((a, b) => a.name.localeCompare(b.name));
      } else if (currentSort === 'author') {
        filtered.sort((a, b) => a.author.localeCompare(b.author));
      }

      return filtered;
    }

    function renderServers() {
      const grid = document.getElementById('servers-grid');
      const servers = filterAndSortServers();

      grid.innerHTML = servers.map(server => {
        const initials = server.name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
        const tagClass = server.type === 'local' ? 'local' : (server.apiRequired ? 'api-required' : 'remote');
        const tagText = server.type === 'local' ? 'Local' : (server.apiRequired ? 'API Key' : 'Remote');
        
        return `
          <div class="card" data-name="${server.name}" onclick="openModal('${server.name.replace(/'/g, "\\'")}')">
            <span class="tag ${tagClass}">${tagText}</span>
            <div class="card-header">
              <div class="card-logo">${initials}</div>
              <h3>${server.name}</h3>
            </div>
            <p>${server.description}</p>
            <div class="card-meta">
              <span class="card-author">By ${server.author}</span>
              <span>⬇️ ${formatNumber(server.installs)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
      return num.toString();
    }

    function openModal(serverName) {
      const server = mcpServers.find(s => s.name === serverName);
      if (!server) return;

      selectedServer = server;
      const modal = document.getElementById('modal-overlay');
      const title = document.getElementById('modal-title');
      const content = document.getElementById('modal-content');

      title.textContent = server.name;
      
      const configExample = `{
  "mcpServers": {
    "${server.name.replace(/\s+/g, '-').toLowerCase()}": {
      "command": "npx",
      "args": ["-y", "${server.package}"]${server.apiRequired ? ',\n      "env": {\n        "API_KEY": "your-api-key-here"\n      }' : ''}
    }
  }
}`;

      content.innerHTML = `
        <div class="modal-section">
          <h4>Description</h4>
          <p>${server.description}</p>
        </div>
        <div class="modal-section">
          <h4>Author</h4>
          <p>${server.author}</p>
        </div>
        <div class="modal-section">
          <h4>Installs</h4>
          <p>${formatNumber(server.installs)} installations</p>
        </div>
        <div class="modal-section">
          <h4>Type</h4>
          <p>${server.type === 'local' ? '🟢 Local (No API Key Required)' : (server.apiRequired ? '🔴 API Key Required' : '🔵 Remote')}</p>
        </div>
        <div class="modal-section">
          <h4>Category</h4>
          <p>${server.category.charAt(0).toUpperCase() + server.category.slice(1)}</p>
        </div>
        <div class="modal-section">
          <h4>Configuration</h4>
          <div class="config-block">${configExample}</div>
        </div>
        ${server.apiRequired ? `
        <div class="modal-section">
          <h4>⚠️ API Key Required</h4>
          <p>This server requires an API key from ${server.author}. Visit their developer portal to obtain credentials.</p>
        </div>
        ` : ''}
      `;

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      selectedServer = null;
    }

    function setupEventListeners() {
      // Search input
      document.getElementById('search-input').addEventListener('input', renderServers);

      // Category filter
      document.getElementById('category-filter').addEventListener('change', renderServers);

      // Sort filter
      document.getElementById('sort-filter').addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderServers();
      });

      // Tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          currentFilter = e.target.dataset.filter;
          renderServers();
        });
      });

      // Modal close
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('modal-overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeModal();
      });

      // Copy config
      document.getElementById('copy-config').addEventListener('click', () => {
        if (selectedServer) {
          const config = `{
  "mcpServers": {
    "${selectedServer.name.replace(/\s+/g, '-').toLowerCase()}": {
      "command": "npx",
      "args": ["-y", "${selectedServer.package}"]${selectedServer.apiRequired ? ',\n      "env": {\n        "API_KEY": "your-api-key-here"\n      }' : ''}
    }
  }
}`;
          navigator.clipboard.writeText(config);
          alert('Configuration copied to clipboard!');
        }
      });

      // Install button
      document.getElementById('install-server').addEventListener('click', () => {
        if (selectedServer) {
          alert(`To install ${selectedServer.name}:\n\n1. Run: npx -y ${selectedServer.package}\n2. Add the configuration to your MCP config file\n${selectedServer.apiRequired ? '3. Obtain API key from ' + selectedServer.author : ''}`);
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
