*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
body{background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
.app{max-width:1400px;margin:0 auto;padding:1.5rem}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1.5rem}
h1{font-size:1.6rem;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.tab{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.5rem 1rem;border-radius:6px;cursor:pointer;transition:.2s}
.tab:hover{border-color:var(--c1);color:var(--text)}.tab.active{background:var(--c1);color:var(--bg);border-color:var(--c1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;transition:.2s;cursor:pointer;position:relative}
.card:hover{border-color:var(--c1);transform:translateY(-2px)}
.card h3{font-size:.95rem;color:var(--c1);margin-bottom:.5rem}
.card p{font-size:.8rem;color:var(--muted);margin-bottom:.5rem}
.tag{position:absolute;top:10px;right:10px;padding:2px 6px;background:rgba(56,189,248,0.15);color:var(--c1);border-radius:10px;font-size:.7rem;text-transform:uppercase}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}
.stat{background:var(--surface);border:1px solid var(--border);padding:.8rem;border-radius:8px}
.stat strong{display:block;font-size:1.5rem;margin-bottom:.2rem}
footer{text-align:center;padding:2rem 0;color:var(--muted);border-top:1px solid var(--border);margin-top:3rem;font-size:.8rem}
@media(max-width:768px){header{flex-direction:column;align-items:flex-start;gap:1rem}}
</style>

const SECTIONS = {
  modules: { label: "27 Modules", data: MODULES.map(m=>({name:m,status:"Active",desc:"Platform core unit"})) },
  agents: { label: "25 Agents", data: AGENTS.map(a=>({name:a,status:"Online",desc:"Planetary execution node"})) },
  assets: { label: "228 Assets", data: Object.entries(ASSETS).flatMap(([k,v])=>v.map(p=>({name:p.split('/').pop(),path:p,type:k})) }
};
let active = "modules";

function render(){
  document.getElementById('meta').innerHTML = `
    <div class="stat"><strong>27</strong><span>Modules</span></div>
    <div class="stat"><strong>25</strong><span>Agents</span></div>
    <div class="stat"><strong>228</strong><span>Assets</span></div>
    <div class="stat"><strong>8</strong><span>Repos Synced</span></div>
  `;
  document.getElementById('tabs').innerHTML = Object.keys(SECTIONS).map(k=>
    `<button class="tab ${k===active?'active':''}" onclick="switchTab('${k}')">${SECTIONS[k].label}</button>`
  ).join('');
  const c = SECTIONS[active].data;
  document.getElementById('content').innerHTML = c.slice(0,50).map(x=>{
    const tag = active==="modules"?"MODULE":active==="agents"?"AGENT":x.type.toUpperCase();
    const sub = active==="modules"?"Core infrastructure":active==="agents"?"Autonomous node":x.path||"";
    return `<div class="card"><span class="tag">${tag}</span><h3>${x.name}</h3><p>${sub}</p></div>`;
  }).join('');
}
function switchTab(t){ active=t; render(); }
window.switchTab = switchTab;
render();
</script>
